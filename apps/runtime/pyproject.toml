[project]
name = "lilavel-runtime"
version = "0.1.0"
description = "The provider-neutral persistent agent kernel for Lilavel."
requires-python = ">=3.12"
dependencies = ["lilavel-contracts", "lilavel-core", "prompt-toolkit==3.0.52"]

[project.scripts]
lilavel = "lilavel_runtime.cli:main"

[tool.uv.sources]
lilavel-core = { path = "../core", editable = true }
lilavel-contracts = { path = "../contracts", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=1",
    "ruff>=0.9",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
extraPaths = ["../contracts/src", "../core/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
