[project]
name = "lilavel-discord-edge"
version = "0.1.0"
description = "The replaceable DM-first Discord environment adapter for LilavelRuntime."
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.7.1",
    "lilavel-contracts",
    "lilavel-core",
    "lilavel-runtime",
    "regex==2026.9.3",
]

[tool.uv.sources]
lilavel-core = { path = "../core", editable = true }
lilavel-contracts = { path = "../contracts", editable = true }
lilavel-runtime = { path = "../runtime", editable = true }

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
extraPaths = ["../contracts/src", "../core/src", "../runtime/src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
